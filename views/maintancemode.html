<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .maintenance-box {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .maintenance-box h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .maintenance-box p {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="maintenance-box">
        <h1>WEBSITE SEDANG MAINTENANCE</h1>
        <p>MOHON BERSABAR</p>
    </div>
</body>
</html>
