<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest API Fajar Official</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
        }
        .container {
            padding: 50px 20px;
        }
        .containerr {
            width: 80%;
            max-width: 600px;
            height: 50px;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            border: 2px solid #000;
            display: flex;
            align-items: center;
        }
        h1 {
            font-size: 28px;
            color: #ffeb3b;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
        }
        p {
            font-size: 18px;
            font-weight: bold;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.5;
        }
        .highlight {
            font-size: 22px;
            color: #ffeb3b;
            font-weight: bold;
            margin-top: 20px;
        }
        .section {
            margin: 40px 0;
        }
        .contact {
            font-size: 22px;
            font-weight: bold;
            color: #ff5722;
            margin-bottom: 10px;
        }
        .button {
            display: inline-block;
            background: #ffeb3b;
            color: #000;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }
        .button:hover {
            background: #ffc107;
            transform: scale(1.1);
        }
        .running-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 18px;
            color: #333;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to Rest API Fajar Official</h1>

        <div class="containerr">
        <div class="running-text">
            <p>Selamat Datang di Rest API Fajar Official. Rest API ini simple, no ribet, tanpa API key, tanpa limit, dan tanpa login. Semoga kalian suka!</p>
        </div>
        
        <div class="section">
            <h2 class="highlight">Fajar Official</h2>
            <h3>Rest API Simple NO Ribet</h3>
        </div>

        <div class="section">
            <h2>Dokumen API</h2>
        </div>

        <div class="section">
            <h2 class="contact">Contact Me</h2>
            <a href="#" class="button">WhatsApp</a>
            <a href="#" class="button">Telegram</a>
        </div>
    </div>

</body>
</html>
